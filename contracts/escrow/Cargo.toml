[package]
name = "babyshark-escrow"
version = "0.1.0"
edition = "2021"
description = "BabyShark escrow (spike): asks OutLayer's TEE verifier about a kid's GitHub work"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

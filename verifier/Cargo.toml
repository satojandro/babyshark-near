[package]
name = "babyshark-verifier"
version = "0.1.0"
edition = "2021"
description = "BabyShark work verifier: runs inside OutLayer (Intel TDX) and checks a kid's GitHub commits"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "babyshark-verifier"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "wasi")'.dependencies]
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
